<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — DevJournal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="glow-purple"></div>
    <div class="glow-indigo"></div>

    <div class="app-container">
        <div class="sidebar">
            <a href="index.html" class="brand-logo">DevJournal</a>
            <div class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-item"><span>🏠</span> Home</a>
                <a href="journals.html" class="sidebar-item"><span>📖</span> Journal Logs</a>
                <a href="projects.html" class="sidebar-item"><span>📁</span> Projects</a>
                <a href="insights.html" class="sidebar-item"><span>📊</span> Insights</a>
                <a href="settings.html" class="sidebar-item active"><span>⚙️</span> Settings</a>
            </div>
        </div>

        <div class="main-content">
            <h2 style="font-size: 32px; font-weight: 800; margin-bottom: 24px;">Settings & Preferences</h2>

            <div class="glass-card">
                <h3 style="font-size: 18px; margin-bottom: 16px;">Profile Details</h3>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div style="width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-indigo), var(--secondary-purple)); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px;">RG</div>
                    <div>
                        <div style="font-weight: 700; font-size: 18px;" id="profileName">Raniel Go</div>
                        <div style="color: var(--text-secondary); font-size: 13px;" id="profileEmail">raniel@devjournal.app</div>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <h3 style="font-size: 18px; margin-bottom: 16px;">Cloud & Integrations</h3>
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-glass);">
                    <span>GitHub Integration</span>
                    <span style="color: var(--success-green); font-weight: 700;">Connected</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0;">
                    <span>Supabase Cloud Sync</span>
                    <input type="checkbox" checked style="accent-color: var(--primary-indigo); width: 18px; height: 18px;">
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('profileName').innerText = DevJournalStore.user.name;
        document.getElementById('profileEmail').innerText = DevJournalStore.user.email;
    </script>
</body>
</html>
