<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights — DevJournal</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="glow-purple"></div>
    <div class="glow-indigo"></div>

    <div class="app-container">
        <div class="sidebar">
            <a href="index.html" class="brand-logo">DevJournal</a>
            <div class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-item"><span>🏠</span> Home</a>
                <a href="journals.html" class="sidebar-item"><span>📖</span> Journal Logs</a>
                <a href="projects.html" class="sidebar-item"><span>📁</span> Projects</a>
                <a href="insights.html" class="sidebar-item active"><span>📊</span> Insights</a>
                <a href="settings.html" class="sidebar-item"><span>⚙️</span> Settings</a>
            </div>
        </div>

        <div class="main-content">
            <h2 style="font-size: 32px; font-weight: 800; margin-bottom: 24px;">Productivity Insights</h2>
            <div class="glass-card">
                <canvas id="chartCanvas" height="140"></canvas>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('chartCanvas').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Focus Hours',
                    data: [4.5, 6.2, 5.8, 7.0, 6.25, 3.5, 2.0],
                    backgroundColor: '#6159f5',
                    borderRadius: 8
                }]
            },
            options: { plugins: { legend: { display: false } } }
        });
    </script>
</body>
</html>
