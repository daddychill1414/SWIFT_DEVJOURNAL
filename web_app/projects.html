<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — DevJournal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="glow-purple"></div>
    <div class="glow-indigo"></div>

    <div class="app-container">
        <div class="sidebar">
            <a href="index.html" class="brand-logo">DevJournal</a>
            <div class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-item"><span>🏠</span> Home</a>
                <a href="journals.html" class="sidebar-item"><span>📖</span> Journal Logs</a>
                <a href="projects.html" class="sidebar-item active"><span>📁</span> Projects</a>
                <a href="insights.html" class="sidebar-item"><span>📊</span> Insights</a>
                <a href="settings.html" class="sidebar-item"><span>⚙️</span> Settings</a>
            </div>
        </div>

        <div class="main-content">
            <h2 style="font-size: 32px; font-weight: 800; margin-bottom: 24px;">Projects Portfolio</h2>
            <div id="projectsContainer"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('projectsContainer').innerHTML = DevJournalStore.projects.map(p => `
            <div class="glass-card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <h3 style="font-size: 20px; font-weight: 700;">${p.name}</h3>
                    <span style="font-size: 11px; color: var(--success-green); background: rgba(51,217,123,0.15); padding: 4px 10px; border-radius: 12px; font-weight: 700;">GitHub Connected</span>
                </div>
                <p style="color: var(--text-secondary); margin-bottom: 16px;">${p.desc}</p>
                <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; display: flex; justify-content: space-between;">
                    <span>Progress</span><span>${p.progress}%</span>
                </div>
                <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden;">
                    <div style="width: ${p.progress}%; height: 100%; background: linear-gradient(90deg, var(--primary-indigo), var(--accent-cyan));"></div>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
