name: Build & Deploy DevJournal to TestFlight

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Swift Package / App
        run: |
          xcodebuild -scheme DevJournal -destination 'generic/platform=iOS' build
